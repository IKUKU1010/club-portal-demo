<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Login - PENOKS Neighborhood Friends</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar">
  <div class="brand"><img src="/assets/logo.png" alt="PENOKS logo"></div>
  <nav>
    <a href="/index.html">Home</a>
    <a href="/about.html">About</a>
    <a href="/events.html">Events</a>
    <a href="/news.html">News</a>
  </nav>
  <a class="contact-btn" href="/contact.html">Contact</a>
</header>

<div class="login-wrap">
  <h1>Member Login</h1>
  <p class="subtle">Enter your Member ID and password to view your dashboard.</p>
  <div id="errorBox" class="error-msg" style="display:none;"></div>
  <form id="loginForm">
    <label>Member ID</label>
    <input name="memberId" placeholder="PNK-0001" required>
    <label>Password</label>
    <input name="password" type="password" required>
    <button class="btn" type="submit" style="width:100%;">Log In</button>
  </form>
  <p class="subtle" style="margin-top:16px;">Not a member yet? <a href="/member-apply.html" style="text-decoration:underline;">Apply here</a>.</p>
</div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const data = Object.fromEntries(new FormData(form));
    const res = await fetch('/api/member/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const body = await res.json();
    if (!res.ok) {
      errorBox.textContent = body.error || 'Login failed';
      errorBox.style.display = 'block';
      return;
    }
    window.location.href = body.redirect || '/dashboard';
  });
</script>

<script src="/js/nav.js"></script>
</body>
</html>
