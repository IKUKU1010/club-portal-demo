<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - PENOKS Neighborhood Friends</title>
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header class="navbar">
  <div class="brand"><img src="/assets/logo.png" alt="PENOKS logo"></div>
  <nav><a href="/index.html">Home</a></nav>
  <a class="contact-btn" href="/contact.html">Contact</a>
</header>

<div class="login-wrap">
  <h1>Admin Login</h1>
  <p class="subtle">Committee &amp; staff access only.</p>
  <div id="errorBox" class="error-msg" style="display:none;"></div>
  <form id="loginForm">
    <label>Username</label>
    <input name="username" required>
    <label>Password</label>
    <input name="password" type="password" required>
    <button class="btn" type="submit" style="width:100%;">Log In</button>
  </form>
</div>

<script>
  const form = document.getElementById('loginForm');
  const errorBox = document.getElementById('errorBox');
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorBox.style.display = 'none';
    const data = Object.fromEntries(new FormData(form));
    const res = await fetch('/api/admin/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(data)
    });
    const body = await res.json();
    if (!res.ok) {
      errorBox.textContent = body.error || 'Login failed';
      errorBox.style.display = 'block';
      return;
    }
    window.location.href = body.redirect || '/admin/dashboard';
  });
</script>

</body>
</html>
